<!DOCTYPE html>
<html>

<head>

    <title>Registration - KisaanConnect</title>

    <link rel="stylesheet"
          href="../static/style.css">

</head>

<body>

<div class="form-container">

    <div class="logo-circle small">
        🌾
    </div>

    <h1 id="registerTitle">
        Registration
    </h1>

    <p>
        Create your KisaanConnect account
    </p>


    <form id="registerForm">

        <label>
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >


        <label>
            Email ID
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Contact Number
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="10-digit mobile number"
            maxlength="10"
            pattern="[0-9]{10}"
            required
        >


    <label>
    📍 Location
</label>

<div class="location-box">

    <input
        type="text"
        id="location"
        placeholder="Village / City / District"
        required
    >

    <button
        type="button"
        onclick="getCurrentLocation()">
        📍 Use My Current Location
    </button>

</div>

<p id="locationMessage"></p>



<input
    type="text"
    id="location"
    placeholder="Enter Village / City / District"
    required
>

<p
    id="locationStatus"
    style="font-size:14px;"    >
</p>
<!-- FARMER UPI -->
<div id="farmerUpiSection" style="display:none;">

    <label>💳 Farmer UPI ID</label>

    <input
        type="text"
        id="upi_id"
        placeholder="example@upi"
    >

    <small>
        This UPI ID will receive payments from consumers.
    </small>

</div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <p id="message"></p>


    <a href="index.html"
       class="back-link">

        ← Back

    </a>

</div>


<script src="../static/script.js"></script>

</body>
</html>
